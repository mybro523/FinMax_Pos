<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinMax POS — касса, склад и смены торговли в одной системе" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/emblem-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/emblem-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/emblem-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/emblem-180.png" />
    <!-- Цвет строки браузера на телефоне — под тему: светлая и глубокий синий -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1230" />
    <!-- inter:start — шрифт Inter (SIL OFL 1.1) со своего сайта, а не у Google: страница не ждёт
         чужой сервер. Один переменный файл на набор букв (толщины 400–700), браузер берёт только
         нужные наборы; кириллица и латиница качаются сразу, cyrillic-ext (таджикские ӣ ӯ ҳ ҷ қ ғ)
         — когда встретится. Программа для Windows этот блок заменяет своим шрифтом (vite.config.js) -->
    <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />
    <!-- inter:end -->
    <title>FinMax POS — касса и склад торговли</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
